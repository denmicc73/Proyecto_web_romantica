spring.application.name=marta-experience

# Puerto: Render inyecta la variable PORT en tiempo de ejecucion.
server.port=${PORT:8080}

# Dominio del frontend permitido para CORS (configurar en produccion).
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:*}

# Actuator minimo, solo health, sin exponer detalles internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
